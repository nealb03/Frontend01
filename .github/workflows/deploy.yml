name: Frontend CI/CD Deployment to AWS

on:
 push:
    branches:
      - main
      - Fargate-FE

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: brentaneal-cluster
  FRONTEND_SERVICE: brentaneal-frontend-service

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Build Frontend
        run: |
          echo "Installing and building frontend..."

          # If your frontend lives in the repo root
          if [ -f package.json ]; then
            echo "Found package.json in repo root. Building in repo root..."
            npm install
            npm run build

          # Or if your frontend lives in a Frontend01 subfolder
          elif [ -f Frontend01/package.json ]; then
            echo "Found package.json in Frontend01. Building in Frontend01..."
            cd Frontend01
            npm install
            npm run build

          else
            echo "Error: No package.json found in repo root or Frontend01." >&2
            exit 1
          fi

      - name: Deploy Frontend — force new ECS deployment
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          FRONTEND_SERVICE: ${{ env.FRONTEND_SERVICE }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is not set." >&2
            exit 1
          fi

          echo "Forcing new deployment for $FRONTEND_SERVICE in cluster $ECS_CLUSTER (region $AWS_REGION)..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"