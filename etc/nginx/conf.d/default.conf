# --------------------------------------------------------------------
# Define connection_upgrade mapping for WebSocket / HTTP upgrades
# --------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --------------------------------------------------------------------
# Frontend Server Block – SPA + API Proxy
# --------------------------------------------------------------------
server {
    listen 80;
    server_name allcloudsvcs.com;
    charset utf-8;

    # -------------------------------------------------
    # Root HTML (SPA build output)
    # -------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------
    # ALB / ECS health‑check endpoint
    # -------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # -------------------------------------------------
    # Static assets
    # -------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm|json|txt|xml|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------
    # Favicon
    # -------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =204;
    }

    # -------------------------------------------------
    # Proxy API calls → backend ALB
    # -------------------------------------------------
    location /api/ {
        # AWS VPC DNS resolver
        resolver 169.254.169.253 valid=30s ipv6=off;
        resolver_timeout 5s;

        # Backend ALB endpoint (HTTP only for now)
        set $backend_host fargate-alb-611289108.us-east-1.elb.amazonaws.com;

        proxy_pass              http://$backend_host$request_uri;
        proxy_http_version      1.1;
        proxy_redirect          off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HTTP upgrade headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # --- CORS support ---
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Authorization, Content-Type, Accept" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # -------------------------------------------------
    # SPA routing fallback
    # -------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------
    # 404 fallback
    # -------------------------------------------------
    error_page 404 /index.html;
}