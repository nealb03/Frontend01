server {
    listen 80;
    server_name allcloudsvcs.com;

    # -------------------------------------------------
    # Root HTML (SPA build)
    # -------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------
    # Health check (for ALB / ECS)
    # -------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # -------------------------------------------------
    # Static / cached assets
    # -------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|wasm|json|txt|xml|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------
    # Favicon
    # -------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =204;
    }

    # -------------------------------------------------
    # Proxy all /api/* calls to backend ALB
    # -------------------------------------------------
    location /api/ {
        # Use ECS local DNS resolver so ELB DNS works in Fargate
        resolver 169.254.169.253 valid=30s ipv6=off;
        # Match your actual backend ALB DNS name
        set $backend_host "fargate-alb-611289108.us-east-1.elb.amazonaws.com";

        # ---- Proxy settings ----
        proxy_pass http://$backend_host$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Handle HTTP → HTTPS mismatch gracefully
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # --- CORS headers (for browser fetches) ---
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Authorization, Content-Type, Accept";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # -------------------------------------------------
    # SPA route handling (fallback to index.html)
    # -------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------
    # Error page fallback
    # -------------------------------------------------
    error_page 404 /index.html;
}